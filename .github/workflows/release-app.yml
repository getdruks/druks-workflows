name: Release app

on:
  workflow_call:
    inputs:
      app:
        description: The name of the app, as druks check-app takes it.
        required: true
        type: string
      python-version:
        description: The Python version that Druks runs on.
        default: "3.11"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv build --wheel
      - name: The tag is the version
        run: |
          version="$(uv version --short)"
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} != pyproject version ${version}"; exit 1; }
      - name: The wheel installs and passes druks check-app
        run: |
          uv venv "${RUNNER_TEMP}/proof"
          uv pip install --python "${RUNNER_TEMP}/proof" dist/*.whl
          "${RUNNER_TEMP}/proof/bin/druks" check-app "${APP}"
        env:
          APP: ${{ inputs.app }}
      - run: cd dist && sha256sum *.whl > "$(ls *.whl).sha256" && cat *.sha256
      - run: gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.sha256 --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
